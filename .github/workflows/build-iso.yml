name: Build HP408 Lite ISO

# Runs on a fresh Windows virtual machine hosted by GitHub.
# Start it from the Actions tab > "Build HP408 Lite ISO" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Windows edition to keep (Pro activates with the tablet''s built-in key)'
        type: choice
        options: ['Windows 10 Home', 'Windows 10 Pro']
        default: 'Windows 10 Home'
      update_url:
        description: 'Optional: direct .msu link of a 22H2 x86 Cumulative Update (Microsoft Update Catalog)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Pick the build drive and free up space
        shell: pwsh
        run: |
          # Remove large preinstalled SDKs we never use (frees ~20 GB)
          foreach ($p in 'C:\Android','C:\hostedtoolcache\windows\CodeQL','C:\Program Files\dotnet\sdk','C:\ghcup','C:\Rust') {
            if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          $drv = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -in 'C','D' } |
                 Sort-Object Free -Descending | Select-Object -First 1
          $work = "$($drv.Name):\HP408Build"
          New-Item "$work\SoftPaqs","$work\Apps","$work\Updates" -ItemType Directory -Force | Out-Null
          "WORK=$work" | Out-File $env:GITHUB_ENV -Append
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          Write-Host "Build folder: $work"

      - name: Install Windows ADK Deployment Tools (oscdimg)
        shell: pwsh
        run: |
          choco install windows-adk-deploy -y --no-progress
          if ($LASTEXITCODE) { Write-Host "::error title=ADK install::choco exit code $LASTEXITCODE"; exit 1 }
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter oscdimg.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Restore cached downloads
        id: dlcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}\dl
          key: drive-${{ hashFiles('drive-files.txt') }}

      - name: Download Windows ISO and HP drivers from Google Drive
        shell: pwsh
        run: |
          python -m pip install --quiet gdown
          $dl = Join-Path $env:WORK 'dl'
          New-Item $dl -ItemType Directory -Force | Out-Null
          Get-Content drive-files.txt | Where-Object { $_ -and $_ -notmatch '^\s*#' } | ForEach-Object {
            $id, $name = $_ -split '\s+', 2
            $cached = Join-Path $dl ($name -replace '[\\/]','_')
            if ((Test-Path $cached) -and (Get-Item $cached).Length -gt 100KB) {
              Write-Host "Cached: $name"
            } else {
              Write-Host "Downloading $name ..."
              $out = gdown "https://drive.google.com/uc?id=$id" -O $cached 2>&1 | Out-String
              if (-not (Test-Path $cached) -or (Get-Item $cached).Length -lt 100KB) {
                $msg = ($out -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 6) -join ' | '
                Write-Host "::error title=Google Drive download failed ($name)::$msg"
                exit 1
              }
            }
            $dest = Join-Path $env:WORK $name
            New-Item (Split-Path $dest) -ItemType Directory -Force | Out-Null
            Copy-Item $cached $dest -Force
            Write-Host ("  OK {0:N1} MB" -f ((Get-Item $dest).Length / 1MB))
          }

      - name: Save downloads to cache (next builds skip Google Drive)
        if: steps.dlcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}\dl
          key: drive-${{ hashFiles('drive-files.txt') }}

      - name: Download apps (WinRAR, Chrome, LibreOffice, SumatraPDF)
        shell: pwsh
        run: |
          try { ./scripts/Get-Apps.ps1 -OutDir "$env:WORK\Apps" }
          catch { Write-Host "::error title=App downloads::$($_.Exception.Message)"; exit 1 }

      - name: Download Windows update (optional)
        if: ${{ inputs.update_url != '' }}
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest '${{ inputs.update_url }}' -OutFile "$env:WORK\Updates\cumulative.msu" -UseBasicParsing
          Write-Host ("Update: {0:N0} MB" -f ((Get-Item "$env:WORK\Updates\cumulative.msu").Length / 1MB))

      - name: Build the Lite ISO
        shell: powershell   # Windows PowerShell 5.1 has the DISM module built in
        run: |
          $log = "$env:WORK\build.log"
          Start-Transcript $log | Out-Null
          $ok = $true
          try {
            & ./scripts/Build-HP408-Lite.ps1 -SourceIso "$env:WORK\Windows.iso" -Work $env:WORK -Edition '${{ inputs.edition }}'
          } catch {
            $ok = $false; $err = $_
          }
          Stop-Transcript | Out-Null
          if (-not $ok) {
            function Esc($t) { "$t".Replace('%','%25').Replace("`r",'').Replace("`n",'%0A') }
            $where = "line $($err.InvocationInfo.ScriptLineNumber): $($err.InvocationInfo.Line.Trim())"
            Write-Host "::error title=Build failed::$(Esc "$($err.Exception.Message) | $where")"
            $tail = (Get-Content $log -Tail 60 | Where-Object { $_.Trim() }) -join "`n"
            Write-Host "::error title=Build log (last lines)::$(Esc $tail)"
            exit 1
          }

      - name: Collect the ISO
        shell: pwsh
        run: |
          $iso = Get-ChildItem $env:WORK -Filter 'AFIF-TECH_*.iso' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $iso) { throw 'ISO was not created' }
          "ISO_PATH=$($iso.FullName)" | Out-File $env:GITHUB_ENV -Append
          $hash = (Get-FileHash $iso.FullName -Algorithm SHA256).Hash
          "## ISO ready`n- File: $($iso.Name)`n- Size: $([math]::Round($iso.Length/1GB,2)) GB`n- SHA256: $hash" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload ISO
        uses: actions/upload-artifact@v5
        with:
          name: AFIF-TECH-Win10-HP408-ISO
          path: ${{ env.ISO_PATH }}
          compression-level: 0
          retention-days: 5
